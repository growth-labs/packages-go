# Growth Labs Go package catalog.
#
# One entry per workspace module, in the same shape as
# growth-labs/packages/docs/agent/package-catalog.yaml minus required_bindings
# (a Go service has no Workers bindings). Read this before writing a shared
# helper: if an entry already serves the need, extend it instead.
#
# Completeness is a gate, not a habit: scripts/check-package-catalog.sh fails
# CI when a `use (...)` entry in go.work has no entry here, when an entry names
# no module, when a working_example_path does not exist, or when a
# related_packages name does not resolve. platform-foundations loads this file
# to render the estate-wide shared-capability index.
packages:
  auth:
    name: "github.com/growth-labs/packages-go/auth"
    summary: "OpenAuth relying-party client for Go services: authorization-code flow, ES256 access-token verification, refresh rotation, secure session cookies, and net/http middleware."
    stability: stable
    use_when:
      - "A Go service needs sign-in, sessions, or JWT verification against the shared OpenAuth issuer."
      - "A Go HTTP handler needs a resolved principal on the request."
    do_not_use_when:
      - "You need to run an auth issuer; that is growth-labs/identity-platform."
      - "You need product authorization (membership walls, roles, entitlements): this module is identity plumbing, and the consumer owns those decisions."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/auth"
      - "auth.New(auth.Config{Issuer, ClientID, Resource, CallbackPath, CookiePrefix, Providers, GatedPaths, LoginPath, LogoutPath})"
      - "Mount the client's middleware ahead of the gated routes"
    required_env: []
    working_example_path: "auth/cmd/example/main.go"
    common_mistakes:
      - "Treating the module as an issuer instead of a relying-party client."
      - "Standing up a second sign-in path for one app instead of registering a client with the shared issuer."
      - "Putting entitlement or role checks inside the module instead of in the consuming service."
    related_packages: ["testkit"]

  email:
    name: "github.com/growth-labs/packages-go/email"
    summary: "Fastmail JMAP transactional email for Go services: session discovery, estate identity selection, send, and sender-side delivery proof."
    stability: maturing
    use_when:
      - "A Go service must send a transactional message: an alert, an invitation, a receipt, a report."
      - "A caller must prove afterwards that a specific message reached the account's Sent mailbox."
      - "A caller must decide whether a failed send is safe to retry (IsUnsubmitted)."
      - "A caller needs typed rate-limit evidence (IsRateLimited and RateLimitError) for a bounded retry policy."
    do_not_use_when:
      - "The work is bulk or campaign sending, list management, or unsubscribe handling."
      - "The service runs on the Workers runtime in TypeScript: use @growth-labs/email (transactional) or @growth-labs/mailer (campaigns)."
      - "You need inbound mail, mailbox sync, or JMAP beyond composing and submitting one message."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/email"
      - "Place the JMAP bearer token in a mode-0600 file on the host; the value's home is Vaultwarden (fastmail-api-token)"
      - "token, err := email.LoadTokenFile(path); client, err := email.New(token, httpClient)"
      - "client.Send(ctx, to, subject, body), then client.VerifyDelivered(ctx, messageID, timeout) when delivery must be proven"
    required_env: []
    working_example_path: "email/example_test.go"
    common_mistakes:
      - "Building an app-local mail client instead of using this module: Fastmail JMAP is the estate's Go email transport, and a second implementation is a defect."
      - "Retrying every failed send: only IsUnsubmitted(err) proves nothing was submitted; a lost response may already have been delivered."
      - "Retrying permanent unsubmitted errors or parsing human error text: require IsUnsubmitted(err) and IsRateLimited(err) for a rate-limit retry."
      - "Reading the token from an environment variable or a wider-than-0600 file; LoadTokenFile refuses anything else."
      - "Treating a successful Send as delivery proof: it is API acceptance, and VerifyDelivered is the sender-side evidence."
    related_packages: ["testkit"]

  fulcrumprojects:
    name: "github.com/growth-labs/packages-go/fulcrumprojects"
    summary: "Fulcrum Projects /api/v2 client for Go services: device-token bearer auth, the snapshot/changes/mutations envelopes, the mutation builders for the GTD mapping (project tasks, todos, delegations, daily links), one-shot retry with a fresh snapshot and fresh mutation ids on a 409 sync_epoch_mismatch, and a typed error taxonomy."
    stability: experimental
    use_when:
      - "A Go service (golemd first) must read a Fulcrum Projects workspace (snapshot, then incremental changes since a cursor) or write to it through the same idempotent mutation batch the app's own sync client uses."
      - "A caller needs the epoch/409 contract handled once: echo the workspace epoch, retry a stale batch exactly once with a fresh snapshot and fresh mutation ids, and report every other result status loudly."
    do_not_use_when:
      - "You need Fulcrum Projects' schema, sync engine or admin import/rollback: those live in fulcrum-labs/fulcrum-projects; this module is a client of its public /api/v2 only."
      - "The caller runs on the Workers runtime in TypeScript: use the app's own sync client."
      - "You want a second scheduling seam outside the app's API (a direct database or D1 path): the ruling is one machine-callable surface, the app's /api/v2."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/fulcrumprojects"
      - "client, err := fulcrumprojects.New(fulcrumprojects.Config{BaseURL, Token, ClientID}) // Token from a mode-0600 file, never a flag or an env var"
      - "snapshot, err := client.Snapshot(ctx, \"\"); changes, err := client.Changes(ctx, snapshot.Cursor, snapshot.Epoch)"
      - "m, err := fulcrumprojects.ProjectTaskCreate(slug, title, priority, status, assignee, nil); snapshot, results, err := client.Retry(ctx, func(s fulcrumprojects.Snapshot) ([]fulcrumprojects.Mutation, error) { return []fulcrumprojects.Mutation{m}, nil })"
    required_env: []
    working_example_path: "fulcrumprojects/example_test.go"
    common_mistakes:
      - "Reusing mutation ids on a retry after a 409: the app folds the epoch into its idempotency hash, so a retried batch needs fresh ids (Retry does this); reusing them returns duplicate results, not applied ones."
      - "Retrying more than once or on any status other than a 409 sync_epoch_mismatch: the epoch moves only on an admin import or rollback, and a second mismatch means a human is changing the workspace."
      - "Treating a batch as applied because the HTTP call returned 200: every result carries its own status (applied, answered, conflict, duplicate, rejected, retryable) and Results.Applied is the check."
      - "Sending more than 32 mutations or 1 MiB in one batch: the API refuses it; split the batch."
      - "Logging or fmt-printing the client to see its config: String()/GoString() redact the token on purpose."
    related_packages: []

  github:
    name: "github.com/growth-labs/packages-go/github"
    summary: "GitHub App installation-token minter for Go services: RS256 App JWT signing, per-call narrowly-scoped tokens (never the installation's full default grant), a budgeted client (call cap, duplicate-read dedupe, rate_limit preflight), and a two-class configuration/transport error taxonomy — no SDK, no third-party JWT/RSA dependency."
    stability: experimental
    use_when:
      - "A Go service authenticating as a GitHub App needs a short-lived token scoped to exactly one repository and permission set for one operation (a PR, a commit status, a settings change)."
      - "A caller needs to bound its own GitHub API usage against a shared installation's rate limit (a call budget, duplicate-read rejection, a rate_limit preflight) rather than trusting every caller to self-limit."
    do_not_use_when:
      - "A runner or an interactive shim needs to hold the App private key itself: this package is authority-only by design (WH-05b) — a runner receives an already-minted token through the runner protocol's secret handoff or the operator API's installation-token route, never this package directly."
      - "You need a full GitHub REST/GraphQL client: this package mints tokens only; issue calls with net/http or another client using the minted Token.Value()."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/github"
      - "client, err := github.New(github.Config{AppID, PrivateKeyPEM}) // PrivateKeyPEM from a vault-delivered file, never a repo secret"
      - "token, err := client.MintInstallationToken(ctx, installationID, repo, github.Permissions{\"contents\": \"write\"})"
      - "child process env: GITHUB_TOKEN=token.Value() — never logged, never placed in a receipt"
    required_env: []
    working_example_path: "github/example_test.go"
    common_mistakes:
      - "Calling MintInstallationToken with an empty Permissions map expecting the installation's default grant: it is refused (CodeInvalidPermissions) rather than silently widened."
      - "Logging or receipting a Token: String()/GoString() redact it on purpose — read the value only through Token.Value(), and only to hand it to a child process's environment or an HTTP client."
      - "Minting the App private key onto a runner host: the design keeps the key on the authority only; a runner is handed an already-minted token."
      - "Retrying a CodeDuplicateRead or CodeCallBudgetExhausted failure immediately: both mean the budget/dedupe guard did its job, not that the call transiently failed."
    related_packages: []

  lifecycle:
    name: "github.com/growth-labs/packages-go/lifecycle"
    summary: "Stdlib-only daemon signal + graceful-shutdown harness for Go services: wait for an OS shutdown signal with an explicit force-exit on a repeated one, and drain a set of named components concurrently against a shared shutdown deadline."
    stability: experimental
    use_when:
      - "A daemon's main needs to turn SIGTERM/SIGINT into a graceful shutdown and force-exit the process if a second signal arrives while shutdown is still in progress."
      - "A daemon has several independently-shutdownable components (HTTP/unix-socket listeners, background loops) that should all be told to stop at once, with a shared deadline, rather than shut down one at a time or left to a bespoke WaitGroup."
    do_not_use_when:
      - "The work is scheduling (tickers, cadence, retry/backoff loops), a receipt interface, the observability client, or the signed-release envelope: none of those are in this module, and it must stay stdlib-only and importable without pulling in any consumer's domain logic."
      - "A component's own shutdown needs to call back into a specific daemon's domain state: Target.Shutdown is a plain func(context.Context) error the caller supplies; this module never inspects or depends on what it does."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/lifecycle"
      - "received := lifecycle.WaitForSignal(signals, func(os.Signal) { os.Exit(1) }) inside a signal-watching goroutine, or lifecycle.ArmSecondSignal(signals, forceExit) right after your own select consumes the first signal"
      - "lifecycle.Drain(drainCtx, report, lifecycle.Target{Name: \"intake\", Shutdown: intake.Shutdown}, ...) to stop every named component concurrently"
    required_env: []
    working_example_path: "lifecycle/example_test.go"
    common_mistakes:
      - "Calling ArmSecondSignal before your own select has consumed the first signal: it watches for the *next* value on the channel, so arming it too early can consume the first signal itself."
      - "Passing a nil Shutdown func on a Target: Drain calls it directly and panics, the same as invoking a nil function anywhere else."
      - "Giving Drain's context no deadline: Shutdown implementations are expected to honor ctx, but nothing in this package enforces a timeout on their behalf."
      - "Reimplementing this daemon's own drainTarget/drainIntakes or signal-plus-force-exit shape locally instead of extending this module: extracted from foundryd and foundry-runner precisely so a third daemon does not do it again."
    related_packages: []

  packaging:
    name: "github.com/growth-labs/packages-go/packaging"
    summary: "Fleet packaging and deployment conventions for Go services: static cross-builds with provenance, portable checksums, signed artifact manifests, hardened systemd units, and health-checked symlink-swap deployment with rollback."
    stability: stable
    use_when:
      - "A Go service needs reproducible release artifacts with a verifiable version and revision stamp."
      - "A host deployment needs an atomic symlink swap with a health gate and automatic rollback."
      - "An installer must verify a signed manifest before activating an artifact."
    do_not_use_when:
      - "The service deploys to the Workers runtime rather than to a fleet host."
      - "You only need a checksum: use crypto/sha256 directly."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/packaging"
      - "Run scripts/build.sh with PACKAGE_MAIN and PACKAGE_NAME set"
      - "Sign the emitted manifest and verify it with packaging.Verify / packaging.VerifyAny before activation"
      - "Deploy with scripts/deploy.sh so the symlink swap keeps its health gate and rollback"
    required_env: []
    working_example_path: "packaging/roundtrip_test.go"
    common_mistakes:
      - "Hand-rolling a per-service build or install script instead of extending these conventions."
      - "Copying binaries into place instead of swapping the symlink, which loses the rollback path."
      - "Activating an artifact before its manifest signature is verified."
    related_packages: []

  pg:
    name: "github.com/growth-labs/packages-go/pg"
    summary: "Forward-only PostgreSQL migrations with a version ledger, an export gate that refuses to migrate without a fresh backup receipt, and owned pgx transaction helpers."
    stability: stable
    use_when:
      - "A Go service owns a PostgreSQL schema and applies ordered migrations at start-up or on deploy."
      - "An application operation needs one owned pgx transaction with commit-on-success and rollback-on-error."
    do_not_use_when:
      - "The store is D1/SQLite or anything other than PostgreSQL."
      - "You want reversible or out-of-order migrations: this runner is deliberately forward-only and strictly increasing."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/pg"
      - "Declare the migration list and wire an ExportGate that returns a recent backup receipt"
      - "Runner.Apply(ctx, pool, migrations) at start-up; set Runner.MaxExportAge to tighten the 24h default"
      - "Use pg.WithTx for application transactions, never for migrations"
    required_env: []
    working_example_path: "pg/runner_test.go"
    common_mistakes:
      - "Writing an ad hoc migration table per service instead of using the packages_go_schema_migrations ledger."
      - "Renumbering or editing an applied migration: the runner detects version and name drift and refuses."
      - "Waiving the export gate without a WaiverReason, or waiving it routinely instead of fixing the backup."
    related_packages: ["testkit"]

  s3:
    name: "github.com/growth-labs/packages-go/s3"
    summary: "Dependency-free SigV4 client for one S3-compatible bucket (path-style or virtual-hosted, AWS S3 or Cloudflare R2): streamed Get (Range-forwarding), prefix-scoped List/Delete, small-payload Put, and PutStream (automatic multipart above a threshold, with read-back verification via Inspect) — no SDK."
    stability: maturing
    use_when:
      - "A Go service must stream one object's bytes through to an HTTP response (e.g. proxying a <video> tag's Range requests) without holding the whole file in memory or handing the client a credential."
      - "A Go service needs prefix-scoped object listing/deletion for operator-driven cleanup, a small fully-buffered payload upload (a JSON receipt, a manifest), or a large streamed upload that must survive a dropped connection without re-sending the whole object (PutStream's automatic multipart)."
    do_not_use_when:
      - "You need a general ArtifactStore (opaque object:// reference resolution, capability-dispatch-shaped source/target types): that domain layer belongs in the consumer, built on top of this package's plain bucket-relative-key API, not inside it."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/s3"
      - "client, err := s3.NewClient(s3.Config{Endpoint, Region, Bucket, PathStyle, AccessKeyID, SecretAccessKey}, httpClient)"
      - "response, err := client.Get(ctx, key, rangeHeader); stream response.Body to the caller"
      - "err := client.PutStream(ctx, key, reader, size, sha256Hex) for a large upload; err := client.Put(ctx, key, body, contentType) for a small one"
    required_env: []
    working_example_path: "s3/example_test.go"
    common_mistakes:
      - "Reading a whole Get response into memory instead of streaming response.Body — defeats the reason this package exists over a bare SDK call."
      - "Passing an absolute key (a leading /): every method requires a bucket-relative path."
      - "Treating Delete as failing on an already-absent key — S3-compatible DELETE is idempotent, and this client treats 404 as success."
      - "Building an app-local SigV4 client, multipart uploader, or ArtifactStore-shaped wrapper instead of using/extending this package: a second implementation of the same signing logic is a defect."
    related_packages: []

  sidecar:
    name: "github.com/growth-labs/packages-go/sidecar"
    summary: "Dependency-free reader/validator for the WH-08 sidecar cut record (component-cut.json): store, kind, cut identity, capturedAt, schema version, writer generation, control-log sequence/hash, cross-store cursors, and the encrypted-owner-cut ciphertext identity/recipients/plaintext-file inventory."
    stability: experimental
    use_when:
      - "A Go service needs to read a sidecar store's own cut record off disk to check its freshness against a recovery-point objective (an owner's freshness tripwire)."
      - "A Go service needs to read back a shipped or handed-off cut's record to verify what it claims about itself (store, kind, schema version, writer generation, cursors) before trusting or importing it."
    do_not_use_when:
      - "You need to capture a sidecar (VACUUM INTO a live store, copy its control log, encrypt it, manage a handoff directory): that capture/write side stays in fulcrum-labs/foundry's backup package, which this module has no opinion on."
      - "You need a general backup-manifest or product-backup-vector type: this package is scoped to one sidecar store's cut record, not the wider manifest naming every backup vector."
    minimal_setup:
      - "go get github.com/growth-labs/packages-go/sidecar"
      - "record, err := sidecar.Parse(payload) // payload is component-cut.json's bytes"
      - "capturedAt, err := record.CapturedAtTime(); withinObjective := time.Since(capturedAt) <= objective"
    required_env: []
    working_example_path: "sidecar/example_test.go"
    common_mistakes:
      - "Reimplementing a narrow read-only subset of this exact JSON shape in a new consumer instead of depending on this package — the second known instance of that (fulcrum-labs/quarry's sidecarfreshness) is why this package exists."
      - "Treating record.CapturedAt as pre-validated: read it through CapturedAtTime(), which fails loud on empty or unparseable values instead of silently returning the zero time."
      - "Constructing a CutRecord by hand for Encrypted=true without CiphertextSHA256/CiphertextBytes/Recipients, or setting any of those without Encrypted=true: Validate rejects both as a shape the real writer never produces."
    related_packages: []

  testkit:
    name: "github.com/growth-labs/packages-go/testkit"
    summary: "Shared test harness: strict JSON fixture runners, the falsifiable-guard mutation helper (ProveGuard), and a disposable real-PostgreSQL harness."
    stability: stable
    use_when:
      - "A test must prove a guard is both wired and falsifiable, per CONVENTIONS.md."
      - "A conformance or parity suite runs from JSON fixtures and needs deterministic ordering."
      - "A test needs a real, disposable PostgreSQL instance rather than a mock."
    do_not_use_when:
      - "You are writing production code: this module is test-only and belongs in a test dependency."
      - "A plain table-driven test already proves the behaviour."
    minimal_setup:
      - "Add github.com/growth-labs/packages-go/testkit to the module's requirements"
      - "testkit.ProveGuard(t, func(m testkit.Mutation) error { ... }) at the public wiring point"
      - "testkit.LoadJSON for fixture suites; testkit/postgres for a disposable instance"
    required_env: []
    working_example_path: "testkit/examples/guards_test.go"
    common_mistakes:
      - "Asserting an internal helper was called instead of asserting consumer-visible rejection."
      - "Proving a guard in isolation rather than at the production wiring point, which hides an unwired guard."
      - "Mocking PostgreSQL instead of using the disposable real instance."
    related_packages: []
